<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🎧 Context v1 — Audio → Whisper</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f4f4f4;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      min-height: 100vh; /* тянем страницу на всю высоту */
    }
    h2 { text-align: center; margin-bottom: 20px; }
    .controls { text-align:center; }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-right: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #start { background: #4caf50; color: white; }
    #stop { background: #f44336; color: white; }
    #log {
      margin-top: 20px;
      white-space: pre-wrap;
      background: #fff;
      padding: 10px;
      border-radius: 8px;
      flex: 1;               /* 🧩 растягиваем блок лога на всё оставшееся место */
      overflow-y: auto;
      border: 1px solid #ccc;
      min-height: 300px;     /* чтобы не был слишком маленьким на низких экранах */
    }
  </style>
</head>
<body>
  <h2>🎧 Context v1 — Audio → Server → Whisper</h2>
  <div class="controls">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>
  <div id="log"></div>

  <script type="module" src="context.js"></script>
</body>
</html>
