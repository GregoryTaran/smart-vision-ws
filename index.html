<script>
let deferredPrompt;

// Проверка: если PWA уже установлено
if (window.matchMedia('(display-mode: standalone)').matches) {
  document.body.innerHTML = `
    <h1>Smart Vision уже установлено ✅</h1>
    <p>Открой приложение со своего экрана</p>
  `;
} else {
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    showInstallButton();
  });
}

function showInstallButton() {
  const btn = document.createElement('button');
  btn.textContent = 'Установить Smart Vision';
  btn.style = `
    padding:12px 24px;
    font-size:16px;
    font-weight:600;
    background:#000;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
  `;
  document.body.appendChild(btn);

  btn.addEventListener('click', async () => {
    btn.remove();
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') {
      console.log('✅ Установлено');
    } else {
      console.log('❌ Отказано');
    }
    deferredPrompt = null;
  });
}
</script>
