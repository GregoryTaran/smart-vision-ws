<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Vision</title>

  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/icons/icon-192.png" />

  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding-top: 60px;
      background: #f5f5f5;
      font-family: system-ui, sans-serif;
      color: #222;
      margin: 0;
      text-align: center;
    }

    #topSection {
      margin-bottom: 60px;
    }

    button {
      padding: 14px 30px;
      font-size: 18px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.25s;
    }

    #installBtn {
      background: #000;
      color: #fff;
    }
    #installBtn:hover {
      background: #333;
    }

    #openBtn {
      background: #008f3e;
      color: #fff;
    }
    #openBtn:hover {
      background: #00a54a;
    }

    #contextBtn {
      background: #fff;
      color: #000;
      border: 2px solid #000;
      margin-top: 2rem;
    }
    #contextBtn:hover {
      background: #e9e9e9;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 0.5rem;
    }

    p {
      line-height: 1.6;
      max-width: 400px;
      color: #444;
      margin: 0.3rem 0;
    }

    footer {
      margin-top: 40px;
      color: #777;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <div id="topSection">
    <p id="statusText">Загрузка...</p>
    <button id="installBtn" style="display:none;">Установить приложение</button>
    <div id="installedControls" style="display:none;">
      <p>Приложение здесь ✅</p>
      <button id="openBtn">Открыть приложение</button>
    </div>
  </div>

  <h1>Smart Vision</h1>
  <p>Любая мысль может стать визией.</p>
  <p>Любая визия может стать дорогой.</p>
  <p>А дорога — источником внутреннего света.</p>

  <button id="contextBtn">Перейти к контексту</button>

  <footer>Грег Таран | 2025</footer>

  <script>
    const installBtn = document.getElementById('installBtn');
    const installedControls = document.getElementById('installedControls');
    const openBtn = document.getElementById('openBtn');
    const contextBtn = document.getElementById('contextBtn');
    const statusText = document.getElementById('statusText');
    const contextUrl = '/context.html';
    let deferredPrompt;

    // Регистрация сервис-воркера
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js');
    }

    // Проверяем, установлено ли приложение
    const isPWA = window.matchMedia('(display-mode: standalone)').matches ||
                  window.navigator.standalone === true;

    if (isPWA) {
      statusText.textContent = 'Smart Vision установлено';
      installedControls.style.display = 'block';
    } else {
      statusText.textContent = 'Smart Vision не установлено';
    }

    // Показываем кнопку установки, когда возможно
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'inline-block';
      statusText.textContent = 'Можно установить приложение';
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        statusText.textContent = '✅ Приложение установлено';
        installBtn.style.display = 'none';
        installedControls.style.display = 'block';
      } else {
        statusText.textContent = '❌ Установка отменена';
      }
      deferredPrompt = null;
    });

    openBtn.addEventListener('click', () => {
      window.location.href = contextUrl;
    });

    // Переход на контекст внутри окна
    contextBtn.addEventListener('click', () => {
      window.location.href = contextUrl;
    });
  </script>
</body>
</html>
